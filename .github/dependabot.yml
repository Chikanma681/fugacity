version: 2
updates:
- package-ecosystem: github-actions
  directory: /
  schedule:
    interval: weekly
    day: saturday
  open-pull-requests-limit: 0
  groups:
    security:
      applies-to: security-updates
      update-types:
      - minor
      - patch
  cooldown:
    default-days: 7
- package-ecosystem: npm
  directory: /
  schedule:
