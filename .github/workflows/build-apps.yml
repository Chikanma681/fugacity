name: build-apps

on:
  pull_request:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  create-release:
    if: ${{ github.ref_type == 'tag' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --draft --title "${GITHUB_REF_NAME}" --notes ""

  build-wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm install

      - run: cp rust/rust-toolchain.toml ./

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false
          rustflags: ''

      - uses: taiki-e/install-action@493d7f216ecab2af0602481ce809ab2c72836fa1
        with:
          tool: wasm-pack

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - run: npm run build:wasm

      - uses: actions/upload-artifact@v7
        with:
          name: wasm
          path: rust/kcl-wasm-lib/pkg/kcl_wasm_lib*

  build-apps:
    needs: [create-release, build-wasm]
    if: ${{ !failure() && !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v8
        with:
          name: wasm
          path: rust/kcl-wasm-lib/pkg

      - name: Copy wasm into public
        shell: bash
        run: cp rust/kcl-wasm-lib/pkg/kcl_wasm_lib_bg.wasm public

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm install

      - name: Build (pull request)
        if: ${{ github.event_name == 'pull_request' }}
        run: npm run tronb:package:dev

      - name: Set version from tag
        if: ${{ github.ref_type == 'tag' }}
        shell: bash
        run: |
          export VERSION=${GITHUB_REF_NAME#v}
          npm run files:set-version

      - name: Build and publish to GitHub Releases
        if: ${{ github.ref_type == 'tag' }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.APPLE_CERTIFICATE }}
          CSC_KEY_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npm run tronb:package:prod
