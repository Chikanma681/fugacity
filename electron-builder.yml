publish:
  - provider: github
    owner: Chikanma681
    repo: fugacity
    releaseType: draft
    channel: latest
releaseInfo:
  releaseNotesFile: release-notes.md
protocols:
  - name: Fugacity
    schemes: ['fugacity']
  - name: Fugacity Auth
    schemes: ['workos-auth']
