appId: com.fugacity.app 
directories:
  output: out
  buildResources: assets
files:
  - .vite/**
  - "!node_modules/win-ca/pem/**"
  - "!node_modules/*esbuild/**"
  - "!node_modules/@napi-rs/**"
mac:
  category: public.app-category.developer-tools
  artifactName: "${productName}-${version}-universal-${os}.${ext}"
  target:
    - target: dmg
      arch:
        - universal
    - target: zip
      arch:
        - universal
  notarize: true
  fileAssociations:
    - ext: fgc 
      name: fgc 
      mimeType: application/vnd.fugacity.project
      description: Fugacity File 
      role: Editor
      rank: Owner
win:
  artifactName: "${productName}-${version}-universal-${os}.${ext}"
  target:
    - target: nsis
      arch:
        - x64
        - arm64
  icon: "assets/icon.ico"
  fileAssociations:
    - ext: fgc 
      name: fgc 
      mimeType: application/vnd.fugacity.project
      description: Fugacity File 
      role: Editor
psis:
  oneClick: false
  perMachine: true
  allowElevation: true
  installerIcon: "assets/icon.ico"
  include: "./scripts/installer.nsh"
  buildUniversalInstaller: true
linux:
  artifactName: "${productName}-${version}-${arch}-${os}.${ext}"
  target:
    - target: appImage
      arch:
        - x64
        - arm64
  fileAssociations:
    - ext: fgc 
      name: fgc 
      mimeType: application/vnd.fugacity.project
      description: Fugacity File 
      role: Editor
publish:
  - provider: github
    owner: Chikanma681
    repo: fugacity
    releaseType: draft
    channel: latest
releaseInfo:
  releaseNotesFile: release-notes.md
protocols:
  - name: Fugacity 
    schemes: ['fugacity']
